{% extends "base.html" %}
{% block tittle %}Iniciar Sesión{% endblock %}

{% block content %}

<div class="form-wrapper">
    <h2 class="form-title">Iniciar Sesión</h2>

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" name="username" id="username" required placeholder="Tu usuario">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required placeholder="Tu contraseña">
        </div>

        <button type="submit" class="btn btn-solid btn-full">Iniciar Sesión</button>

        <p class="form-link">¿No tienes cuenta? <a href="{{ url_for('user.register') }}">Regístrate aquí</a></p>
    </form>
</div>

{% endblock %}
