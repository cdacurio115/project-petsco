{% extends "base.html" %}
{% block tittle %}Registrar Usuario{% endblock %}

{% block content %}

<div class="form-wrapper">
    <h2 class="form-title">Registrar Usuario</h2>

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" name="username" id="username" required placeholder="Elige un usuario">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required placeholder="Elige una contraseña">
        </div>

        <button type="submit" class="btn btn-solid btn-full">Registrarse</button>

        <p class="form-link">¿Ya tienes cuenta? <a href="{{ url_for('user.login') }}">Inicia sesión aquí</a></p>
    </form>
</div>

{% endblock %}
